name: Build all apps

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main, dev]
  push:
    branches: [master, main]

jobs:
  # ---- Android app (mobile) ----
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk

  # ---- Desktop app - Windows (MSI installer + portable exe) ----
  desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      # jpackage needs WiX to build the MSI on Windows
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wix = "$env:TEMP\wix311"
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "$env:TEMP\wix.zip"
          Expand-Archive "$env:TEMP\wix.zip" -DestinationPath $wix -Force
          echo "$wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI installer
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Build portable exe (unpacked app)
        run: ./gradlew :desktopApp:createDistributable --stacktrace

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*

      - name: Upload portable exe
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: desktopApp/build/compose/binaries/main/app/**

  # ---- Desktop app - Linux (.deb) ----
  desktop-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Build .deb package
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*

  # ---- Desktop app - macOS (.dmg) ----
  desktop-macos:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Build .dmg package
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*

  # ---- Desktop app - web interface in Electron (the app published by releases) ----
  desktop-web-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            desktopWeb/package-lock.json

      - name: Build server jar with the web interface
        run: ./gradlew :server:fatJar --stacktrace

      - name: Bundle a Java runtime
        run: |
          jlink \
            --add-modules java.base,java.logging,java.management,java.naming,java.net.http,java.scripting,java.sql,java.xml,jdk.crypto.ec,jdk.unsupported,jdk.zipfs \
            --strip-debug --no-header-files --no-man-pages --compress zip-6 \
            --output desktopWeb/runtime

      - name: Package AppImage and .deb
        working-directory: desktopWeb
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --linux --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-web-linux
          path: |
            desktopWeb/dist/*.AppImage
            desktopWeb/dist/*.deb

  # ---- Server (jar + Docker image) ----
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "gradle"

      # The jar ships the web interface (webapp/), built with npm.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build server fat jar
        run: ./gradlew :server:fatJar --stacktrace

      - name: Upload server jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: server/build/libs/onewpipe-server-all.jar

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t onewpipe-server:latest .

      - name: Push image to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          docker tag onewpipe-server:latest "ghcr.io/$REPO_LOWER/server:latest"
          docker push "ghcr.io/$REPO_LOWER/server:latest"
