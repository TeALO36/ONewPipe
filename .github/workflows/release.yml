name: Release ONewPipe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::A release tag requires KEYSTORE_BASE64 so GitHub APK updates remain installable."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/onewpipe-release.jks
            printf 'storeFile=keystore/onewpipe-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Keystore restored from secret"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - APK will be signed with the debug key"
          fi
      - name: Build Android Release APK
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease -DversionNameOverride="${VERSION#v}" --stacktrace
      - name: Rename APK with version
        run: |
          VERSION_NAME="${{ github.ref_name }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "app/build/outputs/apk/release/ONewPipe-${VERSION_NAME}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/release/*.apk

  # Desktop app: the web interface in Electron, with the server jar and a
  # trimmed Java runtime bundled (desktopWeb/).
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            desktopWeb/package-lock.json
      - name: Build server jar with the web interface
        shell: bash
        run: ./gradlew :server:fatJar --stacktrace
      - name: Bundle a Java runtime
        shell: bash
        run: |
          jlink \
            --add-modules java.base,java.logging,java.management,java.naming,java.net.http,java.scripting,java.sql,java.xml,jdk.crypto.ec,jdk.unsupported,jdk.zipfs \
            --strip-debug --no-header-files --no-man-pages --compress zip-6 \
            --output desktopWeb/runtime
      - name: Package the desktop app
        shell: bash
        working-directory: desktopWeb
        env:
          VERSION: ${{ github.ref_name }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --no-audit --no-fund
          # Tags set the version; manual runs keep the one in package.json.
          args=()
          if [[ "$VERSION" == v* ]]; then args+=("-c.extraMetadata.version=${VERSION#v}"); fi
          npx electron-builder --publish never "${args[@]}"
      - name: Upload Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.os }}
          path: |
            desktopWeb/dist/*.exe
            desktopWeb/dist/*.deb
            desktopWeb/dist/*.AppImage
            desktopWeb/dist/*.dmg

  build-server-windows:
    name: Build Windows server launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server fat jar
        shell: bash
        run: ./gradlew :server:fatJar
      - name: Package Windows server executable
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          jpackage `
            --type app-image `
            --name ONewPipeServer `
            --app-version "$version" `
            --input server/build/libs `
            --main-jar onewpipe-server-all.jar `
            --dest server-dist
          Compress-Archive -Path server-dist/ONewPipeServer -DestinationPath ONewPipe-server-windows.zip -Force
      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: Server-Windows
          path: ONewPipe-server-windows.zip

  build-server:
    name: Build Server fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server fat jar
        run: ./gradlew :server:fatJar
      - name: Upload Server jar
        uses: actions/upload-artifact@v4
        with:
          name: Server-jar
          path: server/build/libs/onewpipe-server-all.jar

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop, build-server, build-server-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          for a in Android-APK Desktop-ubuntu-latest Desktop-windows-latest Desktop-macos-latest Server-jar Server-Windows; do
            gh run download "${{ github.run_id }}" -R "${{ github.repository }}" --dir artifacts --name "$a"
          done

      - name: Flatten artifacts with clear names
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.jar" -o -name "*.zip" \) | while read -r f; do
            case "$f" in
              *.apk)  dest="ONewPipe-${VERSION}-android.apk" ;;
              *windows-setup.exe) dest="ONewPipe-${VERSION}-windows-setup.exe" ;;
              *windows-portable.exe) dest="ONewPipe-${VERSION}-windows-portable.exe" ;;
              *server-windows.zip) dest="ONewPipe-${VERSION}-windows-server.zip" ;;
              *.deb)  dest="ONewPipe-${VERSION}-linux.deb" ;;
              *.AppImage) dest="ONewPipe-${VERSION}-linux.AppImage" ;;
              *.dmg)  dest="ONewPipe-${VERSION}-macos.dmg" ;;
              *.jar)  dest="ONewPipe-${VERSION}-server.jar" ;;
              *)      continue ;;
            esac
            cp "$f" "release-files/$dest"
          done
          ls -la release-files/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" release-files/* --generate-notes --title "ONewPipe ${{ github.ref_name }}"
