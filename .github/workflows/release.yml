name: Release ONewPipe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Rename APK with version
        run: |
          VERSION_NAME="${{ github.ref_name }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "app/build/outputs/apk/release/ONewPipe-${VERSION_NAME}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/release/*.apk

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: msi
          - os: ubuntu-latest
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Install WiX Toolset (Windows MSI only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = "$env:TEMP\wix311"
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "$env:TEMP\wix.zip"
          Expand-Archive "$env:TEMP\wix.zip" -DestinationPath $wix -Force
          echo "$wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Desktop Distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS
      - name: Upload Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/**/*.${{ matrix.ext }}

  build-desktop-portable:
    name: Build Portable Windows EXE (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build portable distributable
        run: ./gradlew :desktopApp:createDistributable
      - name: Zip portable app
        run: |
          powershell Compress-Archive -Path desktopApp/build/compose/binaries/main/app -DestinationPath "ONewPipe-portable-win.zip" -Force
      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Portable-Windows
          path: ONewPipe-portable-win.zip

  build-server:
    name: Build Server fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build server fat jar
        run: ./gradlew :server:fatJar
      - name: Upload Server jar
        uses: actions/upload-artifact@v4
        with:
          name: Server-jar
          path: server/build/libs/onewpipe-server-all.jar

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop, build-desktop-portable, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          for a in Android-APK Desktop-ubuntu-latest Desktop-windows-latest Desktop-Portable-Windows Server-jar; do
            gh run download "${{ github.run_id }}" --dir artifacts --name "$a"
          done

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.deb" -o -name "*.jar" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release-files/* --generate-notes --title "ONewPipe ${{ github.ref_name }}"
