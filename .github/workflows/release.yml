name: Release ONewPipe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::A release tag requires KEYSTORE_BASE64 so GitHub APK updates remain installable."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/onewpipe-release.jks
            printf 'storeFile=keystore/onewpipe-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Keystore restored from secret"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - APK will be signed with the debug key"
          fi
      - name: Build Android Release APK
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease -DversionNameOverride="${VERSION#v}" --stacktrace
      - name: Rename APK with version
        run: |
          VERSION_NAME="${{ github.ref_name }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "app/build/outputs/apk/release/ONewPipe-${VERSION_NAME}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/release/*.apk

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: msi
          - os: ubuntu-latest
            ext: deb
          - os: macos-latest
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Install WiX Toolset (Windows MSI only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = "$env:TEMP\wix311"
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "$env:TEMP\wix.zip"
          Expand-Archive "$env:TEMP\wix.zip" -DestinationPath $wix -Force
          echo "$wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Desktop Distribution
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS -DversionNameOverride="${VERSION#v}"
      - name: Upload Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/**/*.${{ matrix.ext }}

  build-desktop-portable:
    name: Build Portable Windows EXE (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (toolchain for shared/desktopApp)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build portable distributable
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew :desktopApp:createDistributable -DversionNameOverride="${VERSION#v}"
      - name: Zip portable app
        run: |
          powershell Compress-Archive -Path desktopApp/build/compose/binaries/main/app -DestinationPath "ONewPipe-portable-win.zip" -Force
      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Portable-Windows
          path: ONewPipe-portable-win.zip

  build-server-windows:
    name: Build Windows server launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build server fat jar
        shell: bash
        run: ./gradlew :server:fatJar
      - name: Package Windows server executable
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          jpackage `
            --type app-image `
            --name ONewPipeServer `
            --app-version "$version" `
            --input server/build/libs `
            --main-jar onewpipe-server-all.jar `
            --dest server-dist
          Compress-Archive -Path server-dist/ONewPipeServer -DestinationPath ONewPipe-server-windows.zip -Force
      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: Server-Windows
          path: ONewPipe-server-windows.zip

  build-server:
    name: Build Server fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build server fat jar
        run: ./gradlew :server:fatJar
      - name: Upload Server jar
        uses: actions/upload-artifact@v4
        with:
          name: Server-jar
          path: server/build/libs/onewpipe-server-all.jar

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop, build-desktop-portable, build-server, build-server-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          for a in Android-APK Desktop-ubuntu-latest Desktop-windows-latest Desktop-macos-latest Desktop-Portable-Windows Server-jar Server-Windows; do
            gh run download "${{ github.run_id }}" -R "${{ github.repository }}" --dir artifacts --name "$a"
          done

      - name: Flatten artifacts with clear names
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-files
          for f in $(find artifacts -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.deb" -o -name "*.dmg" -o -name "*.jar" -o -name "*.zip" \)); do
            case "$f" in
              *.apk)  dest="ONewPipe-${VERSION}-android.apk" ;;
              *.msi)  dest="ONewPipe-${VERSION}-windows-setup.msi" ;;
              *server-windows.zip) dest="ONewPipe-${VERSION}-windows-server.zip" ;;
              *.zip)  dest="ONewPipe-${VERSION}-windows-portable.zip" ;;
              *.deb)  dest="ONewPipe-${VERSION}-linux.deb" ;;
              *.dmg)  dest="ONewPipe-${VERSION}-macos.dmg" ;;
              *.jar)  dest="ONewPipe-${VERSION}-server.jar" ;;
              *)      dest="$(basename "$f")" ;;
            esac
            cp "$f" "release-files/$dest"
          done
          ls -la release-files/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" release-files/* --generate-notes --title "ONewPipe ${{ github.ref_name }}"
