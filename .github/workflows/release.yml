name: Release ONewPipe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: app/build/outputs/apk/release/*.apk

  build-desktop:
    name: Build Desktop
    strategy:
      matrix:
        include:
          - os: windows-latest
            ext: msi
          - os: ubuntu-latest
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Desktop Distribution
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS
      - name: Upload Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.os }}
          path: desktopApp/build/compose/binaries/main/release/**/*.*

  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten directory and zip
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.apk" -exec cp {} release-files/ \;
          find artifacts -type f -name "*.msi" -exec cp {} release-files/ \;
          find artifacts -type f -name "*.exe" -exec cp {} release-files/ \;
          find artifacts -type f -name "*.deb" -exec cp {} release-files/ \;
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
